name: Tests and Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[server,test]"
      - name: Compile Python sources
        run: python -m compileall -q agents synthetic_cohort_ehr_agent cli.py synth_ehr_sentinel.py enrichment.py
      - name: Run Python tests
        env:
          AUDIT_SECRET_KEY: github-actions-test-only-audit-key
        run: python -m pytest -q
      - name: Verify browser source syntax and functionality
        run: |
          node --check web/engine.js
          node --check web/app.js
          node --test tests_js/*.test.cjs
      - name: Check audit chain integrity
        env:
          AUDIT_SECRET_KEY: github-actions-test-only-audit-key
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test-and-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
