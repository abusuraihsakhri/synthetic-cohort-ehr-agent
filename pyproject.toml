[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-cohort-ehr-engine"
version = "2.0.0"
description = "SynthEHR Sentinel: Statistically Consistent Zero-PHI Synthetic Patient Cohort Generator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
synthetic-cohort-ehr-engine = "synthetic_cohort_ehr_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/synthetic-cohort-ehr-engine"
Repository = "https://github.com/abusuraihsakhri/synthetic-cohort-ehr-engine.git"
