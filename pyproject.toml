[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-cohort-ehr-engine"
version = "2.0.0"
description = "SynthEHR Sentinel: Statistically Consistent Zero-PHI Synthetic Patient Cohort Generator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["agents", "synthetic_cohort_ehr_agent"]
py-modules = ["cli", "enrichment", "synth_ehr_sentinel", "simulator"]

[project.scripts]
synthetic-cohort-ehr-engine = "synthetic_cohort_ehr_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/synthetic-cohort-ehr-agent"
Repository = "https://github.com/abusuraihsakhri/synthetic-cohort-ehr-agent.git"
